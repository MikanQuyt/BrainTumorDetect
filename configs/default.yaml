seed: 42

data:
  annotation_files:
    - dataset/ds1_annotations.json          # DS1: Navoneel (253 anh, 5-Fold CV)
    - dataset/ds2_annotations.json          # DS2: indk214 (Segmentation & Classification)
    - dataset/ds3_annotations.json          # DS3: BRISC 2025 (Stratified 70/15/15)
    - dataset/brats2020_annotations.json    # DS4: BraTS 2020 (2D Axial [FLAIR, T1ce, T2] + WT)
  image_size_vit: 224
  image_size_sam: 1024
  batch_size: 32
  num_workers: 2
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_limit: 15
    brightness_contrast: 0.2
    bbox_min_visibility: 0.3

labels:
  0: No Tumor
  1: Glioma
  2: Meningioma
  3: Pituitary

vit_lora:
  model_name: google/vit-base-patch16-224-in21k
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
    - query
    - value
  loss_type: focal                 # focal | weighted_ce
  label_smoothing: 0.05
  focal_gamma: 2.0
  use_box_head: true
  sfp_dim: 128
  giou_weight: 1.0
  l1_weight: 1.0
  box_loss_weight: 1.0

auto_prompt:
  mode: auto                       # auto | weakly_supervised | box_head | hybrid_box
  detection_threshold: 0.35        # P(Tumor) >= 0.35 -> Recall > 95%
  box_padding: 0.08                # Mở rộng biên hộp +8%
  heatmap_threshold: 0.50
  alpha_layercam: 0.65
  beta_multiplicative: 0.35
